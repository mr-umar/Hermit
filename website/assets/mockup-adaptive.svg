<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" fill="none">
  <!-- Device Frame -->
  <rect x="10" y="10" width="340" height="620" rx="36" fill="#141513" stroke="#2D302A" stroke-width="3" />
  
  <!-- Notch -->
  <rect x="140" y="22" width="80" height="18" rx="9" fill="#0A0B0A" />

  <!-- Step Header -->
  <text x="180" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#86EFAC" text-anchor="middle" letter-spacing="1">PASO 1 DE 2 • ONBOARDING</text>
  <text x="180" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#F4F5F2" text-anchor="middle">Añadir Etiqueta NFC</text>
  <text x="180" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8E928A" text-anchor="middle">Acerca tu etiqueta física a la parte trasera</text>

  <!-- NFC Pulse Antenna Graphic -->
  <circle cx="180" cy="180" r="46" fill="rgba(134, 239, 172, 0.08)" stroke="rgba(134, 239, 172, 0.25)" stroke-width="1.5" />
  <circle cx="180" cy="180" r="30" fill="rgba(134, 239, 172, 0.15)" />
  <path d="M172,172 C178,172 184,178 184,184" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M172,177 C175,177 179,181 179,184" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" fill="none" />
  <circle cx="172" cy="184" r="2.5" fill="#86EFAC" />

  <!-- Skippable Action Button -->
  <rect x="70" y="240" width="220" height="32" rx="16" fill="rgba(244, 245, 242, 0.06)" stroke="#353833" stroke-width="1" />
  <text x="180" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#C5C8C0" text-anchor="middle">Omitir por ahora (Sin NFC) ›</text>

  <!-- Divider -->
  <line x1="36" y1="290" x2="324" y2="290" stroke="#252724" stroke-width="1" />

  <!-- Adaptive Profiles Branching Preview -->
  <text x="36" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#86EFAC" letter-spacing="0.5">CREACIÓN ADAPTATIVA DE PERFILES</text>
  
  <!-- Branch A: Sin Etiqueta -->
  <rect x="36" y="332" width="288" height="120" rx="16" fill="#1B1C1A" stroke="#2F322D" stroke-width="1" />
  <rect x="50" y="346" width="115" height="22" rx="11" fill="rgba(240, 237, 229, 0.08)" />
  <text x="107" y="361" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#ADA99E" text-anchor="middle">MODO TEMPORIZADOR</text>
  <text x="50" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F4F5F2">Bloqueo por tiempo (hasta 12h)</text>
  <text x="50" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8E928A">Salida de emergencia con pausa reflexiva de 60s</text>
  <text x="50" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8E928A">o desactivable para un bloqueo estricto 100%.</text>
  <rect x="50" y="432" width="80" height="14" rx="4" fill="rgba(213, 139, 112, 0.2)" />
  <text x="90" y="443" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#E0957B" text-anchor="middle">Zen no disponible</text>

  <!-- Branch B: Con Etiqueta -->
  <rect x="36" y="464" width="288" height="128" rx="16" fill="#181D17" stroke="rgba(134, 239, 172, 0.35)" stroke-width="1.2" />
  <rect x="50" y="478" width="105" height="22" rx="11" fill="rgba(134, 239, 172, 0.18)" />
  <text x="102" y="493" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#86EFAC" text-anchor="middle">ETIQUETA VINCULADA</text>
  <text x="50" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F4F5F2">Interruptor físico + Modo Zen</text>
  <text x="50" y="537" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#C5C8C0">Activa/desactiva tocando la etiqueta NFC.</text>
  <text x="50" y="553" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#86EFAC">Launcher Zen: Solo teléfono, cámara, música</text>
  <text x="50" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#86EFAC">y hasta 5 apps elegidas. Salida solo con NFC.</text>

  <!-- Safety limit footnote -->
  <text x="180" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666A63" text-anchor="middle">Tope de seguridad interno: 12 horas máximas continuas</text>
</svg>
