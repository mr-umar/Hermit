<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" fill="none">
  <!-- Device Frame -->
  <rect x="10" y="10" width="340" height="620" rx="36" fill="#191A18" stroke="#353731" stroke-width="4" />
  
  <!-- Notch / Camera -->
  <rect x="140" y="22" width="80" height="18" rx="9" fill="#111211" />
  
  <!-- App Header -->
  <text x="36" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#F0EDE5">Hermit</text>
  <text x="36" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#B9B8AE">NFC Focus Guardian</text>
  
  <!-- Hero Card: Focus Active -->
  <rect x="30" y="116" width="300" height="230" rx="20" fill="#242521" stroke="#353731" stroke-width="1.5" />
  
  <!-- Active Chip -->
  <rect x="115" y="136" width="130" height="28" rx="14" fill="rgba(165, 176, 146, 0.15)" />
  <circle cx="132" cy="150" r="4" fill="#A5B092" />
  <text x="144" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#A5B092">Focus Active</text>
  
  <!-- Timer Display -->
  <text x="180" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="-1" fill="#F0EDE5" text-anchor="middle">00:38:42</text>
  <text x="180" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#B9B8AE" text-anchor="middle">Deep Work Profile</text>
  
  <!-- Blocked Counter Shield -->
  <rect x="52" y="258" width="256" height="34" rx="10" fill="rgba(240, 237, 229, 0.04)" />
  <text x="70" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#B9B8AE">Distractions Prevented</text>
  <text x="290" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#A5B092" text-anchor="end">4</text>
  
  <!-- End Session Button (Aviso #D58B70) -->
  <rect x="52" y="302" width="256" height="32" rx="10" fill="#D58B70" />
  <text x="180" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#191A18" text-anchor="middle">End Session</text>
  
  <!-- NFC Physical Tag Card -->
  <rect x="30" y="362" width="300" height="90" rx="18" fill="#242521" stroke="#353731" stroke-width="1.5" />
  <rect x="46" y="382" width="46" height="46" rx="23" fill="rgba(165, 176, 146, 0.15)" />
  <path d="M64,395 C69,395 74,400 74,405 C74,410 69,415 64,415" stroke="#A5B092" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M68,398 C71,398 74,401 74,405 C74,409 71,412 68,412" stroke="#BAC5A9" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="62" cy="405" r="2.5" fill="#A5B092" />
  
  <text x="104" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#F0EDE5">Physical NFC Tag Ready</text>
  <text x="104" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#B9B8AE">Tap NTAG213/215/216 on back of phone</text>
  
  <!-- Registered Tag Item -->
  <rect x="30" y="468" width="300" height="64" rx="16" fill="#242521" stroke="#353731" stroke-width="1.5" />
  <circle cx="56" cy="500" r="14" fill="rgba(240, 237, 229, 0.05)" />
  <text x="82" y="496" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F0EDE5">Office Desk Tag</text>
  <text x="82" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#A5B092">Toggle Focus • Deep Work</text>
  <rect x="264" y="488" width="50" height="24" rx="12" fill="rgba(165, 176, 146, 0.2)" />
  <text x="289" y="504" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#A5B092" text-anchor="middle">Active</text>
  
  <!-- Bottom Navigation -->
  <rect x="10" y="570" width="340" height="60" rx="0" fill="#141513" />
  <circle cx="65" cy="595" r="4" fill="#A5B092" />
  <text x="65" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#A5B092" text-anchor="middle">Focus</text>
  
  <text x="135" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#B9B8AE" text-anchor="middle">Profiles</text>
  <text x="195" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#B9B8AE" text-anchor="middle">Tags</text>
  <text x="255" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#B9B8AE" text-anchor="middle">Stats</text>
  <text x="305" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#B9B8AE" text-anchor="middle">Settings</text>
</svg>
