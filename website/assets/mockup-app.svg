<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" fill="none">
  <!-- Device Frame -->
  <rect x="10" y="10" width="340" height="620" rx="36" fill="#0F172A" stroke="#334155" stroke-width="4" />
  
  <!-- Notch / Camera -->
  <rect x="140" y="22" width="80" height="18" rx="9" fill="#020617" />
  
  <!-- App Header -->
  <text x="36" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Hermit</text>
  <text x="36" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">NFC Focus Guardian</text>
  
  <!-- Hero Card: Focus Active -->
  <rect x="30" y="116" width="300" height="230" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  
  <!-- Active Chip -->
  <rect x="115" y="136" width="130" height="28" rx="14" fill="rgba(13, 148, 136, 0.15)" />
  <circle cx="132" cy="150" r="4" fill="#0D9488" />
  <text x="144" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#14B8A6">Focus Active</text>
  
  <!-- Timer Display -->
  <text x="180" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="-1" fill="#F8FAFC" text-anchor="middle">00:38:42</text>
  <text x="180" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Deep Work Profile</text>
  
  <!-- Blocked Counter Shield -->
  <rect x="52" y="258" width="256" height="34" rx="10" fill="rgba(255, 255, 255, 0.04)" />
  <text x="70" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Distractions Prevented</text>
  <text x="290" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0D9488" text-anchor="end">4</text>
  
  <!-- End Session Button -->
  <rect x="52" y="302" width="256" height="32" rx="10" fill="#DC2626" />
  <text x="180" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">End Session</text>
  
  <!-- NFC Physical Tag Card -->
  <rect x="30" y="362" width="300" height="90" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <rect x="46" y="382" width="46" height="46" rx="23" fill="rgba(13, 148, 136, 0.15)" />
  <path d="M64,395 C69,395 74,400 74,405 C74,410 69,415 64,415" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M68,398 C71,398 74,401 74,405 C74,409 71,412 68,412" stroke="#14B8A6" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="62" cy="405" r="2.5" fill="#0D9488" />
  
  <text x="104" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">Physical NFC Tag Ready</text>
  <text x="104" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">Tap NTAG213/215/216 on back of phone</text>
  
  <!-- Registered Tag Item -->
  <rect x="30" y="468" width="300" height="64" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <circle cx="56" cy="500" r="14" fill="rgba(255, 255, 255, 0.05)" />
  <text x="82" y="496" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Office Desk Tag</text>
  <text x="82" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0D9488">Toggle Focus • Deep Work</text>
  <rect x="264" y="488" width="50" height="24" rx="12" fill="rgba(13, 148, 136, 0.2)" />
  <text x="289" y="504" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#14B8A6" text-anchor="middle">Active</text>
  
  <!-- Bottom Navigation -->
  <rect x="10" y="570" width="340" height="60" rx="0" fill="#090D16" />
  <circle cx="65" cy="595" r="4" fill="#0D9488" />
  <text x="65" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0D9488" text-anchor="middle">Focus</text>
  
  <text x="135" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Profiles</text>
  <text x="195" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Tags</text>
  <text x="255" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Stats</text>
  <text x="305" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Settings</text>
</svg>
