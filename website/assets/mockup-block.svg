<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" fill="none">
  <!-- Device Frame -->
  <rect x="10" y="10" width="340" height="620" rx="36" fill="#0A0F1D" stroke="#1E293B" stroke-width="4" />
  
  <!-- Notch -->
  <rect x="140" y="22" width="80" height="18" rx="9" fill="#020617" />
  
  <!-- Profile Pill -->
  <rect x="110" y="65" width="140" height="28" rx="14" fill="rgba(255, 255, 255, 0.08)" />
  <circle cx="126" cy="79" r="4" fill="#0D9488" />
  <text x="180" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#E2E8F0" text-anchor="middle">Deep Work</text>
  
  <!-- Central Mindful Orb -->
  <circle cx="180" cy="220" r="60" fill="rgba(13, 148, 136, 0.1)" />
  <circle cx="180" cy="220" r="40" fill="rgba(13, 148, 136, 0.2)" />
  
  <!-- App Icon Placeholder in Orb -->
  <rect x="162" y="202" width="36" height="36" rx="8" fill="#F8FAFC" />
  <circle cx="180" cy="220" r="8" fill="#0D9488" />
  
  <!-- Title & Quote -->
  <text x="180" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#FFFFFF" text-anchor="middle">Stay Mindful</text>
  
  <text x="180" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#CBD5E1" text-anchor="middle">"Instagram" is blocked during Deep Work.</text>
  
  <text x="180" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Take a breath. You chose to protect this moment</text>
  <text x="180" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">for what truly matters.</text>
  
  <!-- Time Pill -->
  <rect x="120" y="425" width="120" height="26" rx="8" fill="rgba(255, 255, 255, 0.05)" />
  <text x="180" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#14B8A6" text-anchor="middle">00:38:42 remaining</text>
  
  <!-- NFC Instructions Banner -->
  <rect x="36" y="490" width="288" height="42" rx="14" fill="rgba(255, 255, 255, 0.06)" />
  <circle cx="60" cy="511" r="10" fill="#0D9488" />
  <path d="M57,508 C60,508 62,510 62,512" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <text x="80" y="516" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Tap physical NFC tag to unlock</text>
  
  <!-- Home Button -->
  <rect x="36" y="546" width="288" height="42" rx="12" fill="#0D9488" />
  <text x="180" y="572" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Return to Home</text>
</svg>
