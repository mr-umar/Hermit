# Nginx Server Configuration for Hermit
# Domain: hermit.umarmohammad.xyz
# Web Root: /var/www/hermit

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name hermit.umarmohammad.xyz;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hermit.umarmohammad.xyz;

    root /var/www/hermit;
    index index.html;

    # TLS Certificates (configured via Certbot)
    ssl_certificate /etc/letsencrypt/live/hermit.umarmohammad.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hermit.umarmohammad.xyz/privkey.pem;

    # Recommended Modern TLS Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching (1 month)
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # HTML and Metadata - Revalidate Every Request
    location ~* \.(?:html|xml|txt)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Deny Hidden Files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
